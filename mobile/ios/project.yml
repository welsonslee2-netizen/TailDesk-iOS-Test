name: TailDeskMobile
options:
  bundleIdPrefix: com.taildesk
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TailDeskMobile:
    type: application
    platform: iOS
    sources:
      - TailDeskMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TailDeskMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.taildesk.mobile
        PRODUCT_NAME: TailDesk
        CODE_SIGN_STYLE: Automatic

